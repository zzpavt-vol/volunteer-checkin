<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>志工活動打卡</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
      background: #f5f6f8;
      color: #333;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-top: 30px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 26px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .card h2 {
      margin-top: 0;
      font-size: 20px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 17px;
      cursor: pointer;
      margin-top: 10px;
    }

    .line-btn {
      background: #06c755;
      color: #fff;
    }

    .primary-btn {
      background: #333;
      color: #fff;
    }

    .secondary-btn {
      background: #eee;
      color: #333;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-top: 8px;
      outline: none;
    }

    input:focus {
      border-color: #888;
    }

    .hidden {
      display: none !important;
    }

    .welcome {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .activity-card {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 18px;
      margin-top: 14px;
    }

    .activity-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .activity-info {
      line-height: 1.8;
      color: #555;
      font-size: 15px;
    }

    .success {
      text-align: center;
    }

    .success-icon {
      font-size: 60px;
      margin-bottom: 10px;
    }

    .success-title {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .message {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      line-height: 1.6;
    }

    .error-message {
      background: #fff0f0;
      color: #c62828;
    }

    .info-message {
      background: #f1f1f1;
      color: #555;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 30px 0;
    }

    .detail-row {
      margin: 8px 0;
    }

    .detail-label {
      font-weight: bold;
    }

    .footer {
      text-align: center;
      color: #999;
      font-size: 13px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- =========================
         登入頁
    ========================== -->
    <div id="loginPage">

      <div class="logo">🙋</div>

      <h1>志工活動打卡</h1>

      <div class="subtitle">
        中正國中家長會志工團
      </div>

      <div class="card">

        <h2>歡迎使用</h2>

        <p>
          請使用 LINE 登入，即可進行志工活動打卡。
        </p>

        <button
          id="loginBtn"
          class="line-btn"
          onclick="loginWithLine()"
        >
          使用 LINE 登入
        </button>

      </div>

    </div>


    <!-- =========================
         姓名登記頁
    ========================== -->
    <div id="registerPage" class="hidden">

      <div class="logo">👋</div>

      <h1>歡迎加入</h1>

      <div class="subtitle">
        第一次使用，請先留下您的姓名
      </div>

      <div class="card">

        <label>
          志工姓名
        </label>

        <input
          id="nameInput"
          type="text"
          placeholder="請輸入姓名"
        >

        <button
          class="primary-btn"
          onclick="registerVolunteer()"
        >
          確認
        </button>

      </div>

    </div>


    <!-- =========================
         志工首頁
    ========================== -->
    <div id="homePage" class="hidden">

      <div class="welcome">
        👋 <span id="volunteerName"></span>，您好！
      </div>

      <div class="card">

        <h2>📅 目前活動</h2>

        <div id="activityList">
          <div class="loading">
            活動資料載入中...
          </div>
        </div>

      </div>

      <div class="card">

        <h2>📱 活動打卡</h2>

        <p>
          若您是透過活動 QR Code 進入，
          系統會直接顯示該活動資訊。
        </p>

      </div>

    </div>


    <!-- =========================
         活動詳細頁
    ========================== -->
    <div id="activityPage" class="hidden">

      <div class="card">

        <h2>📅 活動資訊</h2>

        <div id="activityDetail">
          <div class="loading">
            活動資料載入中...
          </div>
        </div>

        <button
          id="checkInBtn"
          class="primary-btn"
          onclick="checkIn()"
        >
          立即打卡
        </button>

        <button
          class="secondary-btn"
          onclick="showHome()"
        >
          返回首頁
        </button>

      </div>

    </div>


    <!-- =========================
         打卡結果頁
    ========================== -->
    <div id="resultPage" class="hidden">

      <div class="card success">

        <div
          id="resultIcon"
          class="success-icon"
        >
          ✅
        </div>

        <div
          id="resultTitle"
          class="success-title"
        >
          打卡成功
        </div>

        <div
          id="resultMessage"
          class="message info-message"
        >
        </div>

        <button
          class="primary-btn"
          onclick="showHome()"
        >
          返回首頁
        </button>

      </div>

    </div>


    <div
      id="systemMessage"
      class="hidden"
    ></div>


    <div class="footer">
      中正國中家長會志工團
    </div>

  </div>


<script>

/* =====================================================
   系統設定
===================================================== */

const LIFF_ID = "2011537657-PTc0Hdyd";


/*
 * 注意：
 * 這裡已經換成你剛剛確認的新版 Apps Script 網址
 */
const API_URL =
  "https://script.google.com/macros/s/AKfycbyE84f7zjXk1Jb35sl9X4U-DqfMpM8uKNzhsNRx-fbgab6hXkA40I8vV5W3Rmw1m4gtHg/exec";


/* =====================================================
   全域變數
===================================================== */

let currentProfile = null;

let currentVolunteer = null;

let currentActivity = null;


/* =====================================================
   頁面初始化
===================================================== */

window.onload = async function() {

  try {

    await liff.init({
      liffId: LIFF_ID
    });


    /*
     * 尚未登入
     */
    if (!liff.isLoggedIn()) {

      showPage("loginPage");

      return;

    }


    /*
     * 已經登入
     */
    await afterLogin();


  } catch (error) {

    console.error("LIFF 初始化錯誤：", error);

    showSystemError(
      "系統載入失敗：" +
      (error.message || error)
    );

  }

};


/* =====================================================
   LINE 登入
===================================================== */

function loginWithLine() {

  if (!liff.isLoggedIn()) {

    liff.login();

  }

}


/* =====================================================
   登入後處理
===================================================== */

async function afterLogin() {

  try {

    currentProfile =
      await liff.getProfile();


    console.log(
      "LINE User ID：",
      currentProfile.userId
    );


    /*
     * 查詢志工資料
     */
    const result =
      await apiGetVolunteer(
        currentProfile.userId
      );


    console.log(
      "志工資料：",
      result
    );


    if (
      result.success &&
      result.volunteer
    ) {

      /*
       * 已經登記過
       */
      currentVolunteer =
        result.volunteer;


      document.getElementById(
        "volunteerName"
      ).textContent =
        currentVolunteer.Name || "";


      showHome();


      /*
       * 載入目前活動
       */
      await loadCurrentActivities();


    } else {

      /*
       * 第一次使用
       */
      showPage("registerPage");

    }


  } catch (error) {

    console.error(
      "取得志工資料錯誤：",
      error
    );


    showSystemError(
      "無法取得志工資料，請稍後再試。"
    );

  }

}


/* =====================================================
   API：取得志工
===================================================== */

async function apiGetVolunteer(
  lineUserId
) {

  const url =
    API_URL +
    "?action=getVolunteer" +
    "&lineUserId=" +
    encodeURIComponent(
      lineUserId
    );


  const response =
    await fetch(
      url,
      {
        method: "GET"
      }
    );


  if (!response.ok) {

    throw new Error(
      "API HTTP 錯誤：" +
      response.status
    );

  }


  const data =
    await response.json();


  return data;

}


/* =====================================================
   登記志工
===================================================== */

async function registerVolunteer() {

  const nameInput =
    document.getElementById(
      "nameInput"
    );


  const name =
    nameInput.value.trim();


  if (!name) {

    alert("請輸入姓名");

    nameInput.focus();

    return;

  }


  try {

    const url =
      API_URL +
      "?action=registerVolunteer" +
      "&lineUserId=" +
      encodeURIComponent(
        currentProfile.userId
      ) +
      "&name=" +
      encodeURIComponent(
        name
      );


    const response =
      await fetch(
        url,
        {
          method: "GET"
        }
      );


    if (!response.ok) {

      throw new Error(
        "API HTTP 錯誤：" +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      "登記結果：",
      result
    );


    if (
      !result.success
    ) {

      alert(
        result.message ||
        "登記失敗"
      );

      return;

    }


    currentVolunteer =
      result.volunteer;


    document.getElementById(
      "volunteerName"
    ).textContent =
      currentVolunteer.Name || name;


    showHome();


    await loadCurrentActivities();


  } catch (error) {

    console.error(
      "登記志工錯誤：",
      error
    );


    alert(
      "目前無法完成登記，請稍後再試。"
    );

  }

}


/* =====================================================
   載入目前活動
===================================================== */

async function loadCurrentActivities() {

  const activityList =
    document.getElementById(
      "activityList"
    );


  activityList.innerHTML =
    '<div class="loading">活動資料載入中...</div>';


  try {

    const url =
      API_URL +
      "?action=getCurrentActivities";


    const response =
      await fetch(
        url,
        {
          method: "GET"
        }
      );


    if (!response.ok) {

      throw new Error(
        "API HTTP 錯誤：" +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      "目前活動：",
      result
    );


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        "取得活動失敗"
      );

    }


    const activities =
      result.activities || [];


    if (
      activities.length === 0
    ) {

      activityList.innerHTML =
        '<div class="info-message">目前沒有開放中的活動。</div>';

      return;

    }


    activityList.innerHTML = "";


    activities.forEach(
      function(activity) {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "activity-card";


        card.innerHTML = `

          <div class="activity-name">
            ${escapeHtml(
              activity.ActivityName
            )}
          </div>

          <div class="activity-info">

            📅 日期：
            ${escapeHtml(
              activity.Date || ""
            )}

            <br>

            ⏰ 時間：
            ${escapeHtml(
              activity.StartTime || ""
            )}
            -
            ${escapeHtml(
              activity.EndTime || ""
            )}

            <br>

            📍 地點：
            ${escapeHtml(
              activity.Location || ""
            )}

          </div>

          <button
            class="primary-btn"
            onclick="openActivity('${encodeURIComponent(activity.ActivityID)}')"
          >
            查看活動
          </button>

        `;


        activityList.appendChild(
          card
        );

      }
    );


  } catch (error) {

    console.error(
      "取得活動錯誤：",
      error
    );


    activityList.innerHTML =
      '<div class="message error-message">目前無法取得活動資料，請稍後再試。</div>';

  }

}


/* =====================================================
   開啟活動
===================================================== */

async function openActivity(
  encodedActivityId
) {

  const activityId =
    decodeURIComponent(
      encodedActivityId
    );


  await showActivity(
    activityId
  );

}


/* =====================================================
   顯示活動
===================================================== */

async function showActivity(
  activityId
) {

  showPage(
    "activityPage"
  );


  const activityDetail =
    document.getElementById(
      "activityDetail"
    );


  activityDetail.innerHTML =
    '<div class="loading">活動資料載入中...</div>';


  try {

    const url =
      API_URL +
      "?action=getActivity" +
      "&activityId=" +
      encodeURIComponent(
        activityId
      );


    const response =
      await fetch(
        url,
        {
          method: "GET"
        }
      );


    if (!response.ok) {

      throw new Error(
        "API HTTP 錯誤：" +
        response.status
      );

    }


    const result =
      await response.json();


    if (
      !result.success ||
      !result.activity
    ) {

      throw new Error(
        result.message ||
        "找不到活動"
      );

    }


    currentActivity =
      result.activity;


    activityDetail.innerHTML = `

      <div class="detail-row">
        <span class="detail-label">
          活動名稱：
        </span>
        ${escapeHtml(
          currentActivity.ActivityName
        )}
      </div>

      <div class="detail-row">
        <span class="detail-label">
          日期：
        </span>
        ${escapeHtml(
          currentActivity.Date || ""
        )}
      </div>

      <div class="detail-row">
        <span class="detail-label">
          時間：
        </span>
        ${escapeHtml(
          currentActivity.StartTime || ""
        )}
        -
        ${escapeHtml(
          currentActivity.EndTime || ""
        )}
      </div>

      <div class="detail-row">
        <span class="detail-label">
          地點：
        </span>
        ${escapeHtml(
          currentActivity.Location || ""
        )}
      </div>

      ${
        currentActivity.Description
          ? `
            <div class="detail-row">
              <span class="detail-label">
                活動說明：
              </span>
              ${escapeHtml(
                currentActivity.Description
              )}
            </div>
          `
          : ""
      }

    `;


    /*
     * 如果活動不是開放狀態
     */
    const status =
      String(
        currentActivity.Status || ""
      ).toLowerCase();


    const checkInBtn =
      document.getElementById(
        "checkInBtn"
      );


    if (
      status !== "open" &&
      status !== "active"
    ) {

      checkInBtn.disabled =
        true;

      checkInBtn.textContent =
        "活動已結束";

    } else {

      checkInBtn.disabled =
        false;

      checkInBtn.textContent =
        "立即打卡";

    }


  } catch (error) {

    console.error(
      "取得活動錯誤：",
      error
    );


    activityDetail.innerHTML =
      '<div class="message error-message">找不到此活動。</div>';


    document.getElementById(
      "checkInBtn"
    ).disabled =
      true;

  }

}


/* =====================================================
   打卡
===================================================== */

async function checkIn() {

  if (
    !currentActivity
  ) {

    alert(
      "目前沒有活動資料"
    );

    return;

  }


  if (
    !currentProfile
  ) {

    alert(
      "請先使用 LINE 登入"
    );

    return;

  }


  const checkInBtn =
    document.getElementById(
      "checkInBtn"
    );


  checkInBtn.disabled =
    true;


  checkInBtn.textContent =
    "打卡中...";


  try {

    const url =
      API_URL +
      "?action=checkIn" +
      "&activityId=" +
      encodeURIComponent(
        currentActivity.ActivityID
      ) +
      "&lineUserId=" +
      encodeURIComponent(
        currentProfile.userId
      );


    const response =
      await fetch(
        url,
        {
          method: "GET"
        }
      );


    if (!response.ok) {

      throw new Error(
        "API HTTP 錯誤：" +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      "打卡結果：",
      result
    );


    if (
      result.success
    ) {

      showResult(
        "SUCCESS",
        "打卡成功",
        `
          活動：${escapeHtml(
            currentActivity.ActivityName
          )}
          <br>
          打卡時間：
          ${escapeHtml(
            result.checkInTime || ""
          )}
        `
      );


      return;

    }


    /*
     * 已經打卡
     */
    if (
      result.status ===
      "ALREADY_CHECKED"
    ) {

      showResult(
        "ALREADY",
        "已完成打卡",
        `
          您已完成此活動的打卡。
          <br>
          打卡時間：
          ${escapeHtml(
            result.checkInTime || ""
          )}
        `
      );


      return;

    }


    /*
     * 活動已結束
     */
    if (
      result.status ===
      "CLOSED"
    ) {

      showResult(
        "CLOSED",
        "活動已結束",
        result.message ||
        "目前無法打卡"
      );


      return;

    }


    /*
     * 找不到活動
     */
    if (
      result.status ===
      "NOT_FOUND"
    ) {

      showResult(
        "ERROR",
        "找不到活動",
        result.message ||
        "請確認活動 QR Code 是否正確"
      );


      return;

    }


    showResult(
      "ERROR",
      "打卡失敗",
      result.message ||
      "目前無法完成打卡"
    );


  } catch (error) {

    console.error(
      "打卡錯誤：",
      error
    );


    showResult(
      "ERROR",
      "系統發生錯誤",
      "目前無法完成打卡，請稍後再試。"
    );


  } finally {

    checkInBtn.disabled =
      false;

    checkInBtn.textContent =
      "立即打卡";

  }

}


/* =====================================================
   顯示打卡結果
===================================================== */

function showResult(
  type,
  title,
  message
) {

  const icon =
    document.getElementById(
      "resultIcon"
    );


  const resultTitle =
    document.getElementById(
      "resultTitle"
    );


  const resultMessage =
    document.getElementById(
      "resultMessage"
    );


  if (
    type === "SUCCESS"
  ) {

    icon.textContent =
      "✅";

  } else if (
    type === "ALREADY"
  ) {

    icon.textContent =
      "⚠️";

  } else if (
    type === "CLOSED"
  ) {

    icon.textContent =
      "⚠️";

  } else {

    icon.textContent =
      "❌";

  }


  resultTitle.textContent =
    title;


  resultMessage.innerHTML =
    message;


  showPage(
    "resultPage"
  );

}


/* =====================================================
   返回首頁
===================================================== */

function showHome() {

  showPage(
    "homePage"
  );

}


/* =====================================================
   顯示指定頁面
===================================================== */

function showPage(
  pageId
) {

  const pages = [
    "loginPage",
    "registerPage",
    "homePage",
    "activityPage",
    "resultPage"
  ];


  pages.forEach(
    function(id) {

      const page =
        document.getElementById(
          id
        );


      if (id === pageId) {

        page.classList.remove(
          "hidden"
        );

      } else {

        page.classList.add(
          "hidden"
        );

      }

    }
  );

}


/* =====================================================
   顯示系統錯誤
===================================================== */

function showSystemError(
  message
) {

  showPage(
    "loginPage"
  );


  const oldMessage =
    document.getElementById(
      "systemMessage"
    );


  oldMessage.className =
    "message error-message";


  oldMessage.textContent =
    message;


  oldMessage.classList.remove(
    "hidden"
  );


  const loginPage =
    document.getElementById(
      "loginPage"
    );


  loginPage.prepend(
    oldMessage
  );

}


/* =====================================================
   HTML 安全處理
===================================================== */

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   如果網址帶有 activityId
   代表是掃描活動 QR Code 進來
===================================================== */

async function checkActivityFromUrl() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const activityId =
    params.get(
      "activityId"
    );


  if (
    !activityId
  ) {

    return;

  }


  /*
   * 如果已經登入，
   * 直接開啟活動
   */
  if (
    liff.isLoggedIn()
  ) {

    await showActivity(
      activityId
    );

  }

}


/* =====================================================
   登入完成後檢查 QR Code 活動
===================================================== */

const originalAfterLogin =
  afterLogin;


/*
 * 重新包裝登入後流程
 */
afterLogin =
  async function() {

    await originalAfterLogin();


    const params =
      new URLSearchParams(
        window.location.search
      );


    const activityId =
      params.get(
        "activityId"
      );


    if (
      activityId &&
      currentVolunteer
    ) {

      await showActivity(
        activityId
      );

    }

  };


</script>
